app = "qingcheng-job-tracker"
primary_region = "sin"

[build]

[[mounts]]
  source = "job_tracker_data"
  destination = "/data"

[http_service]
  internal_port = 8420
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
